---
# M2 DevSecOps - J2 : VM jenkins (Jenkins + SonarQube) et son durcissement
#
#   Ex 1  : ansible-playbook jenkins.yml --tags jenkins
#   Ex 6  : ansible-playbook jenkins.yml --tags hardening,jenkins_hardening
#   Ex 12 : ansible-playbook jenkins.yml --tags sonarqube
#   Tout  : ansible-playbook jenkins.yml

- name: Installer et durcir la VM jenkins
  hosts: ci
  become: true

  vars:
    jenkins_home: /var/lib/jenkins
    sonarqube_image: sonarqube:community
    sonarqube_bind_ip: "{{ ansible_host }}"

  handlers:
    - name: Restart jenkins
      ansible.builtin.systemd_service:
        name: jenkins
        state: restarted

    - name: Common handlers
      ansible.builtin.import_tasks: handlers/common.yml

  pre_tasks:
    - name: Ping
      ansible.builtin.ping:
      tags: always

  tasks:
    - name: Durcissement commun (SSH clé only, UFW, mises à jour, Lynis)
      ansible.builtin.import_tasks: tasks/hardening.yml
      tags: hardening

    # ------------------------------------------------------------------
    # Ex 1 - installation de Jenkins
    # ------------------------------------------------------------------
    - name: Installer Java et les outils utilisés par les jobs
      ansible.builtin.apt:
        name:
          - openjdk-21-jre-headless
          - fontconfig
          - git
          - python3
          - python3-venv
          - python3-pip
          - ansible
          - curl
        state: present
        update_cache: true
        cache_valid_time: 3600
      tags: jenkins

    - name: Créer le dossier des clés APT
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"
      tags: jenkins

    - name: Récupérer la clé de signature du dépôt Jenkins
      ansible.builtin.get_url:
        url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
        dest: /etc/apt/keyrings/jenkins-keyring.asc
        mode: "0644"
      tags: jenkins

    - name: Ajouter le dépôt Jenkins LTS
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/"
        filename: jenkins
        state: present
      tags: jenkins

    - name: Installer Jenkins
      ansible.builtin.apt:
        name: jenkins
        state: present
        update_cache: true
      tags: jenkins

    - name: Démarrer Jenkins au boot
      ansible.builtin.systemd_service:
        name: jenkins
        enabled: true
        state: started
      tags: jenkins

    - name: Attendre que Jenkins génère le mot de passe initial
      ansible.builtin.wait_for:
        path: "{{ jenkins_home }}/secrets/initialAdminPassword"
        timeout: 180
      failed_when: false
      tags: jenkins

    - name: Lire le mot de passe administrateur initial
      ansible.builtin.slurp:
        src: "{{ jenkins_home }}/secrets/initialAdminPassword"
      register: jenkins_init_pwd
      failed_when: false
      no_log: true
      tags: jenkins

    - name: Afficher l'URL et le mot de passe initial (à usage unique)
      ansible.builtin.debug:
        msg: >-
          Jenkins : http://{{ ansible_host }}:8080 - mot de passe initial :
          {{ (jenkins_init_pwd.content | default('') | b64decode | trim) or 'déjà consommé (setup terminé)' }}
      tags: jenkins

    # ------------------------------------------------------------------
    # Ex 6 - moindre privilège sur le compte jenkins
    # ------------------------------------------------------------------
    - name: Compte jenkins sans shell interactif
      ansible.builtin.user:
        name: jenkins
        shell: /usr/sbin/nologin
      tags: jenkins_hardening

    - name: Home jenkins verrouillé (lisible par jenkins seulement)
      ansible.builtin.file:
        path: "{{ jenkins_home }}"
        state: directory
        owner: jenkins
        group: jenkins
        mode: "0700"
      tags: jenkins_hardening

    - name: Mot de passe du compte jenkins verrouillé
      ansible.builtin.user:
        name: jenkins
        password_lock: true
      tags: jenkins_hardening

    - name: Retirer jenkins des groupes privilégiés
      ansible.builtin.command: gpasswd -d jenkins {{ item }}
      loop: [sudo, docker, adm]
      register: gpasswd
      changed_when: gpasswd.rc == 0
      failed_when: false
      tags: jenkins_hardening

    - name: Aucune règle sudo pour jenkins
      ansible.builtin.file:
        path: /etc/sudoers.d/jenkins
        state: absent
      tags: jenkins_hardening

    - name: Supprimer la clé de déploiement copiée en clair sur le disque (remplacée par le Credentials Store)
      ansible.builtin.file:
        path: "{{ jenkins_home }}/.ssh/id-rda-infra.key"
        state: absent
      tags: jenkins_secrets

    # ------------------------------------------------------------------
    # Ex 12 - SonarQube (conteneur Docker)
    # ------------------------------------------------------------------
    - name: Installer Docker
      ansible.builtin.apt:
        name:
          - docker.io
          - python3-docker
        state: present
      tags: sonarqube

    - name: Paramètres noyau requis par Elasticsearch (SonarQube)
      ansible.posix.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        sysctl_file: /etc/sysctl.d/99-sonarqube.conf
        state: present
      loop:
        - { name: vm.max_map_count, value: "524288" }
        - { name: fs.file-max, value: "131072" }
      tags: sonarqube

    - name: Volumes persistants SonarQube
      community.docker.docker_volume:
        name: "{{ item }}"
      loop: [sonarqube_data, sonarqube_extensions, sonarqube_logs]
      tags: sonarqube

    - name: Lancer SonarQube (écoute uniquement sur le réseau privé)
      community.docker.docker_container:
        name: sonarqube
        image: "{{ sonarqube_image }}"
        restart_policy: unless-stopped
        published_ports:
          - "{{ sonarqube_bind_ip }}:9000:9000"
        volumes:
          - sonarqube_data:/opt/sonarqube/data
          - sonarqube_extensions:/opt/sonarqube/extensions
          - sonarqube_logs:/opt/sonarqube/logs
        ulimits:
          - nofile:131072:131072
      tags: sonarqube

    - name: Attendre que SonarQube soit prêt
      ansible.builtin.uri:
        url: "http://{{ sonarqube_bind_ip }}:9000/api/system/status"
        return_content: true
      register: sonar_status
      until: sonar_status.json is defined and sonar_status.json.status == 'UP'
      retries: 40
      delay: 10
      tags: sonarqube

    - name: Audit Lynis
      ansible.builtin.import_tasks: tasks/audit.yml
      tags: audit
