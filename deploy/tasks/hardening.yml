# Durcissement commun (J1 ex 14 à 18), appliqué aux VM applicatives et à la VM jenkins.

- name: Trouver le disque de démarrage
  ansible.builtin.shell: >-
    set -o pipefail &&
    lsblk -rnso NAME,TYPE "$(findmnt -no SOURCE /)" | awk '$2=="disk"{print $1; exit}'
  args:
    executable: /bin/bash
  register: boot_disk
  changed_when: false
  tags: updates

- name: Indiquer à GRUB le bon disque d'installation
  ansible.builtin.debconf:
    name: grub-pc
    question: grub-pc/install_devices
    vtype: multiselect
    value: "/dev/{{ boot_disk.stdout }}"
  tags: updates

- name: Terminer une éventuelle installation de paquets interrompue
  ansible.builtin.command: dpkg --configure -a
  environment:
    DEBIAN_FRONTEND: noninteractive
  register: dpkg_fix
  changed_when: dpkg_fix.stdout | length > 0
  tags: updates

- name: Mettre à jour les paquets (apt update + upgrade)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    upgrade: dist
  tags: updates

- name: Installer unattended-upgrades
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - apt-listchanges
    state: present
  tags: updates

- name: Activer les mises à jour de sécurité automatiques
  ansible.builtin.copy:
    src: files/20auto-upgrades
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
  tags: updates

- name: N'autoriser que la clé id-rda-infra pour admin
  ansible.posix.authorized_key:
    user: "{{ admin_user }}"
    key: "{{ admin_pubkey }}"
    exclusive: true
    state: present
  tags: ssh

- name: Bannière légale (Lynis BANN-7126 / BANN-7130)
  ansible.builtin.copy:
    src: files/issue
    dest: "{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - /etc/issue
    - /etc/issue.net
  tags: [ssh, lynis_fixes]

- name: Durcir la configuration sshd
  ansible.builtin.template:
    src: templates/sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart sshd
  tags: ssh

- name: Installer UFW
  ansible.builtin.apt:
    name: ufw
    state: present
  tags: firewall

- name: Ouvrir uniquement les ports nécessaires
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ ufw_allowed_ports }}"
  tags: firewall

- name: Politique par défaut + activation (deny in / allow out)
  community.general.ufw:
    state: enabled
    direction: "{{ item.direction }}"
    default: "{{ item.policy }}"
    logging: "on"
  loop:
    - { direction: incoming, policy: deny }
    - { direction: outgoing, policy: allow }
  tags: firewall

- name: Durcissement noyau via sysctl (Lynis KRNL-6000)
  ansible.builtin.copy:
    src: files/90-hardening.conf
    dest: /etc/sysctl.d/90-hardening.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload sysctl
  tags: lynis_fixes

- name: Installer fail2ban (Lynis DEB-0880)
  ansible.builtin.apt:
    name:
      - fail2ban
      - python3-systemd
    state: present
  tags: lynis_fixes

- name: Configurer fail2ban pour sshd
  ansible.builtin.copy:
    src: files/jail.local
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban
  tags: lynis_fixes

- name: Activer fail2ban
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started
  tags: lynis_fixes
