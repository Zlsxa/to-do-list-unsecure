---
# M2 DevSecOps - déploiement + durcissement de la todolist (J1, adapté pour Jenkins en J2)
#
# Depuis le PC (WSL), tout faire :
#   ansible-playbook deploy_app.yml
# Depuis Jenkins (job todolist-deploy), déploiement applicatif uniquement :
#   ansible-playbook deploy_app.yml --limit app-dev --tags app,check -e app_branch=<branche>
#
# Règle de sécurité : app-prod1 (app_env=production) ne reçoit QUE la branche main.

- name: Déployer et durcir la todolist
  hosts: app_servers
  become: true

  vars:
    app_user: todolist
    app_home: /opt/todolist
    app_dir: "{{ app_home }}/app"
    venv_dir: "{{ app_home }}/venv"
    app_repo: https://github.com/Zlsxa/to-do-list-unsecure.git
    app_branch: main
    app_port: 80
    deployed_by: "{{ lookup('ansible.builtin.env', 'BUILD_USER') | default('manuel', true) }}"
    deploy_build: "{{ lookup('ansible.builtin.env', 'BUILD_URL') | default('hors Jenkins', true) }}"

  handlers:
    - name: Restart todolist
      ansible.builtin.systemd_service:
        name: todolist
        state: restarted
        daemon_reload: true

    - name: Common handlers
      ansible.builtin.import_tasks: handlers/common.yml

  pre_tasks:
    - name: Ping
      ansible.builtin.ping:
      tags: always

    - name: La production ne reçoit que du code validé (branche main)
      ansible.builtin.assert:
        that: app_env != 'production' or app_branch == 'main'
        fail_msg: >-
          REFUS : {{ inventory_hostname }} est la production, seule la branche main
          peut y être déployée (branche demandée : {{ app_branch }}).
        quiet: true
      tags: always

  tasks:
    - name: Durcissement commun
      ansible.builtin.import_tasks: tasks/hardening.yml

    - name: Installer les dépendances système
      ansible.builtin.apt:
        name:
          - python3
          - python3-venv
          - python3-pip
          - git
          - acl
          - curl
        state: present
        update_cache: true
        cache_valid_time: 3600
      tags: app

    - name: Créer l'utilisateur système todolist
      ansible.builtin.user:
        name: "{{ app_user }}"
        system: true
        shell: /usr/sbin/nologin
        home: "{{ app_home }}"
        create_home: true
      tags: app

    - name: Restreindre les droits du répertoire applicatif
      ansible.builtin.file:
        path: "{{ app_home }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0750"
      tags: app

    - name: Récupérer les sources depuis GitHub
      ansible.builtin.git:
        repo: "{{ app_repo }}"
        version: "{{ app_branch }}"
        dest: "{{ app_dir }}"
        force: true
      become: true
      become_user: "{{ app_user }}"
      register: app_git
      notify: Restart todolist
      tags: app

    - name: Générer la liste des dépendances depuis le Pipfile
      ansible.builtin.command:
        cmd: python3 ci/pipfile2req.py Pipfile {{ app_home }}/requirements.txt
        chdir: "{{ app_dir }}"
      become: true
      become_user: "{{ app_user }}"
      changed_when: false
      tags: app

    - name: Installer les dépendances Python dans un virtualenv
      ansible.builtin.pip:
        requirements: "{{ app_home }}/requirements.txt"
        virtualenv: "{{ venv_dir }}"
        virtualenv_command: python3 -m venv
      become: true
      become_user: "{{ app_user }}"
      notify: Restart todolist
      tags: app

    - name: Installer gunicorn
      ansible.builtin.pip:
        name: gunicorn
        virtualenv: "{{ venv_dir }}"
        virtualenv_command: python3 -m venv
      become: true
      become_user: "{{ app_user }}"
      tags: app

    - name: Désactiver DEBUG en production
      ansible.builtin.lineinfile:
        path: "{{ app_dir }}/todo/settings.py"
        regexp: '^DEBUG\s*='
        line: "DEBUG = False"
      when: app_env == 'production'
      become: true
      become_user: "{{ app_user }}"
      notify: Restart todolist
      tags: app

    - name: Restreindre ALLOWED_HOSTS en production
      ansible.builtin.lineinfile:
        path: "{{ app_dir }}/todo/settings.py"
        regexp: '^ALLOWED_HOSTS\s*='
        line: "ALLOWED_HOSTS = ['{{ ansible_host }}']"
      when: app_env == 'production'
      become: true
      become_user: "{{ app_user }}"
      notify: Restart todolist
      tags: app

    - name: Appliquer les migrations Django
      ansible.builtin.command:
        cmd: "{{ venv_dir }}/bin/python manage.py migrate --noinput"
        chdir: "{{ app_dir }}"
      become: true
      become_user: "{{ app_user }}"
      register: migrate
      changed_when: "'No migrations to apply' not in migrate.stdout"
      tags: app

    - name: Déployer le service systemd todolist
      ansible.builtin.template:
        src: templates/todolist.service.j2
        dest: /etc/systemd/system/todolist.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart todolist
      tags: app

    - name: Activer et démarrer todolist au boot
      ansible.builtin.systemd_service:
        name: todolist
        enabled: true
        state: started
        daemon_reload: true
      tags: app

    - name: Tracer le déploiement sur le serveur
      ansible.builtin.lineinfile:
        path: /var/log/todolist-deploy.log
        line: >-
          {{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }} env={{ app_env }}
          branche={{ app_branch }} commit={{ app_git.after[:7] }}
          par={{ deployed_by }} build={{ deploy_build }}
        create: true
        insertafter: EOF
        owner: root
        group: adm
        mode: "0640"
      tags: app

    - name: Appliquer les handlers avant les contrôles
      ansible.builtin.meta: flush_handlers
      tags: always

    - name: Vérifier que la todolist répond
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:{{ app_port }}/"
        status_code: 200
        return_content: true
      register: http_check
      until: http_check.status == 200
      retries: 10
      delay: 3
      delegate_to: localhost
      become: false
      tags: check

    - name: Vérifier que le contenu est bien celui de la todolist
      ansible.builtin.assert:
        that: "'TO DO LIST' in http_check.content"
        quiet: true
      tags: check

    - name: Vérifier l'utilisateur qui exécute gunicorn
      ansible.builtin.command: ps -o user= -C gunicorn
      register: gunicorn_user
      changed_when: false
      failed_when: "'root' in gunicorn_user.stdout_lines or gunicorn_user.stdout == ''"
      tags: check

    - name: Audit Lynis
      ansible.builtin.import_tasks: tasks/audit.yml
